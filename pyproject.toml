[project]
name            = "meta-sched"
version         = "0.1.0"
description     = "Meta Scheduler"
authors         = [{name="Ruben Horn"}]
readme          = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fabric>=3.2.2",
    "flask>=3.1.0",
    "pandas>=2.2.3",
    "requests>=2.32.3",
]

[project.scripts]
ms-cli     = "meta_sched:run_cli"
ms-submitd = "meta_sched:run_submitd"
ms-api     = "meta_sched:serve_api"
ms-service = "meta_sched:run_service"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = ["examples"]

[tool.uv]
package = true

dev-dependencies = [
    "mypy>=1.15.0",
    "pyright>=1.1.393",
    # For static type checking
    "types-paramiko>=3.5.0",
    "types-requests>=2.32.0.20241016",
]

[tool.mypy]
strict                 = true
ignore_missing_imports = true

[tool.pyright]
# For using pandas objects without excessive checking
reportOptionalMemberAccess = false
reportOptionalSubscript    = false
