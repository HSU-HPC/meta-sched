selector-strategy                :  Fastest-Absolute-Value
tuning-strategies                :  []
tuning-metric                    :  energy
tuning-interval                  :  2500
tuning-samples                   :  3
tuning-max-evidence              :  10
functor                          :  Lennard-Jones (12-6)

# Demo config "forcing" fewer OpenMP threads
container                        :  [LinkedCells]
traversal                        :  [lc_c01]
data-layout                      :  [SoA]
newton3                          :  [disabled]
cell-size                        :  [1]

cutoff                           :  2.5
verlet-skin-radius               :  0.5
verlet-rebuild-frequency         :  10
deltaT                           :  0.00182367
boundary-type                    :  [periodic, periodic, periodic]
iterations                       :  100000
Sites:
  0:
    epsilon                      :  1.
    sigma                        :  1.
    mass                         :  1.
Objects:
  CubeGrid:
    0:
      particle-type-id           :  0
      particles-per-dimension    :  [15, 15, 15]
      particle-spacing           :  1.5
      bottomLeftCorner           :  [0, 0, 0]
      velocity                   :  [0, 0, 0]
thermostat:
  initialTemperature             :  1.4
  targetTemperature              :  1.4
  deltaTemperature               :  2
  thermostatInterval             :  10
  addBrownianMotion              :  true

no-end-config                    :  true
no-progress-bar                  :  true
vtk-filename                     :  simulation
vtk-output-folder                :  vtkOutput
vtk-write-frequency              :  10000
thread-count                     :  [84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144]
