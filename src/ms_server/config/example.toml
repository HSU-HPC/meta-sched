host = "localhost"
port = 8001
db_url = "sqlite:///:memory:" # Use an ephemeral in-memory database

scheduling_loop_interval = 10
scheduler_class_name = "stochastic.py:WeightedByCoresAvailability"
[scheduler_parameter_overrides]
unavailable_discount_factor = 0.1


[[targets]]
# https://portal.hpc.hsu-hh.de/documentation/hsuper/partitions/
id = "hsuper-small"
host = "hsuper-login01.hsu-hh.de"
batch_system = "slurm"
queue = "small"
nodes = 569
cores_per_node = 72
max_time = "72:00:00"
max_nodes = 5
tags = ["x86", "slurm"]
[targets.module_map]
MPI = "intel-oneapi-mpi"


[[targets]]
id = "windhpc-hsu-full"
host = "windhpc00.hsu-hh.de"
batch_system = "slurm"
queue = "full"
nodes = 4
cores_per_node = 48
max_time = "7-00:00:00"
source_scripts = ["/etc/profile"]
tags = ["x86", "windhpc", "slurm"]
[targets.module_map]
MPI = "mpi"


[[targets]]
id = "windhpc-hlrs"
host = "training.hlrs.de"
batch_system = "pbs"
queue = "windhpc"
nodes = 5
cores_per_node = 48
max_time = "24:00:00"
tags = ["x86", "windhpc", "pbs"]
[targets.module_map]
MPI = "mpi/openmpi"


[[targets]]
id = "windhpc-wwit"
host = "windpark.windhpc.de"
batch_system = "slurm"
nodes = 5
cores_per_node = 48
source_scripts = ["/etc/profile"]
tags = ["x86", "green", "windhpc", "slurm"]
[targets.module_map]
MPI = "mpi/openmpi"
