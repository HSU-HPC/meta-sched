[project]
name = "metasched-server"
version = "0.1.0"
description     = "Meta Scheduler"
authors         = [{name="Ruben Horn"}]
requires-python = ">=3.12"

dependencies = [
    # TODO remove fabric/paramiko
    "fabric>=3.2.2",
    "flask>=3.1.0",
    "pandas>=2.2.3",
    "typeguard>=4.4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyright>=1.1.393",
    # For static type checking
    # TODO remove fabric/paramiko
    "types-paramiko>=3.5.0",
]

[project.scripts]
msserver = "server:main"

[tool.setuptools]
package-dir = {"" = "../../src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["server", "server.config", "server.scheduler", "common"]

[tool.setuptools.package-data]
"server" = ["config/example.toml"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux'",
]
