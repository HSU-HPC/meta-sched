[project]
name = "meta-sched-client"
dynamic = ["version"]
description     = "Meta Scheduler Client"
authors         = [{name="Ruben Horn"}]
requires-python = ">=3.9"

dependencies = [
    "fabric>=3.2.2",
    "frozendict>=2.4.6",
    "pandas>=2.2.3",
    "pydantic>=2.11.7",
    "requests>=2.32.3",
    "sympy>=1.14.0",
    "tomli>=2.2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.2.240807",
    "pyright>=1.1.393",
    # For static type checking
    "ruff>=0.16.1",
    "types-paramiko>=3.5.0.20250516",
    "types-requests>=2.32.0.20241016",
]

[project.scripts]
mscli = "ms_client.cli:main"
msprobe = "ms_client.probe:main"

[tool.setuptools]
package-dir = {"" = "../../src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["ms_client", "ms_client.remote_target", "ms_client.data", "ms_client.probe", "ms_common"]

[tool.setuptools.package-data]
"ms_client.data" = ["**/*"]

[tool.setuptools.dynamic]
version = {attr = "ms_common.__version__"}

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux'",
]
