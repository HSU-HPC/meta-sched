[project]
name = "meta-sched-server"
dynamic = ["version"]
description     = "Meta Scheduler Server"
authors         = [{name="Ruben Horn"}]
requires-python = ">=3.12"

dependencies = [
    "deprecated>=1.2.18",
    # TODO remove fabric/paramiko dependency
    "fabric>=3.2.2",
    "fastapi>=0.115.14",
    "pandas>=2.2.3",
    "pydantic>=2.11.7",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyright>=1.1.393",
    # TODO remove fabric/paramiko dependency
    # For static type checking
    "types-paramiko>=3.5.0",
]

[project.scripts]
msserver = "ms_server:main"

[tool.setuptools]
package-dir = {"" = "../../src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["ms_server", "ms_server.config", "ms_server.scheduler", "ms_common"]

[tool.setuptools.package-data]
"server" = ["config/example.toml"]

[tool.setuptools.dynamic]
version = {attr = "ms_common.__version__"}

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux'",
]
